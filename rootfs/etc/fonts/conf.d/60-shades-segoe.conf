<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Shades: apps and web pages asking for Windows' Segoe UI get Selawik, Microsoft's
     open-source font made to stand in for it. -->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Selawik</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable</family>
    <accept><family>Selawik</family></accept>
  </alias>
</fontconfig>
